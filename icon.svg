<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>

    <!-- Speech / Chat -->
    <symbol id="icon-speech" viewBox="0 0 24 24">
      <path
        d="M20 11.5C20 15.09 16.42 18 12 18C10.88 18 9.82 17.8 8.88 17.45L5 20V16.15C3.76 14.94 3 13.3 3 11.5C3 7.91 6.58 5 12 5C17.42 5 20 7.91 20 11.5Z"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linejoin="round"
      />
    </symbol>


    <!-- Audio / Speaker -->
    <symbol id="icon-audio" viewBox="0 0 24 24">
      <path
        d="M4 10V14H8L13 19V5L8 10H4Z"
        fill="currentColor"
      />

      <path
        d="M16 9C17.1 10.1 17.1 13.9 16 15"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />

      <path
        d="M18.5 6.5C21.8 9.8 21.8 14.2 18.5 17.5"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </symbol>


    <!-- Voice / Microphone -->
    <symbol id="icon-voice" viewBox="0 0 24 24">
      <rect
        x="8"
        y="3"
        width="8"
        height="12"
        rx="4"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      />

      <path
        d="M5 11V12C5 15.87 8.13 19 12 19C15.87 19 19 15.87 19 12V11"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />

      <path
        d="M12 19V22M9 22H15"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </symbol>
<symbol id="icon-speech-to-text" viewBox="0 0 24 24">
  <!-- Microphone -->
  <rect
    x="4"
    y="3"
    width="6"
    height="11"
    rx="3"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
  />

  <!-- Voice pickup -->
  <path
    d="M2 9V10C2 13.3 4.7 16 8 16"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
  />

  <path
    d="M12 9V10C12 13.3 10.7 16 8 16"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Text -->
  <path
    d="M14 7H21M14 11H21M14 15H19"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Conversion arrow -->
  <path
    d="M8 19H19"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
  />

  <path
    d="M16 17L19 19L16 21"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</symbol>



<symbol id="icon-sun" viewBox="0 0 24 24">
  <!-- Sun -->
  <circle
    cx="12"
    cy="12"
    r="4"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
  />

  <!-- Sun rays -->
  <path
    d="M12 2V4
       M12 20V22
       M2 12H4
       M20 12H22
       M4.93 4.93L6.34 6.34
       M17.66 17.66L19.07 19.07
       M19.07 4.93L17.66 6.34
       M6.34 17.66L4.93 19.07"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
  />
</symbol>

<symbol id="icon-moon" viewBox="0 0 24 24">
  <path
    d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5
       A8.5 8.5 0 1 0 20.5 14.5Z"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linejoin="round"
  />
</symbol>

  <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
  </symbol>

  <symbol id="icon-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="8" x2="12" y2="12"></line>
    <line x1="12" y1="16" x2="12.01" y2="16"></line>
  </symbol>

  </defs>
</svg>